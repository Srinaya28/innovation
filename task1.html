<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align:center;
        }
        input,select,button{
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h3>Calculate Program</h3>
    <input type="number"placeholder="Enter the 1st value" id="num1">
    <input type="number"placeholder="Enter the 2nd value" id="num2"><br>
    <select id="operation">
        <option value="add">add</option>
        <option value="Subraction">subraction</option>
        <option value="Multiplication">multiplication</option>
        <option value="division">division</option>
        <option value="Modulus">Modulus</option>
    </select>
    <button onclick="calculate()">calculate</button>
    <div id="result">result:</div>
    <script>
        function calculate(){
            const num1=parseInt(document.getElementById("num1").value);
            const num2=parseInt(document.getElementById("num2").value);
            const operation=document.getElementById("operation").value;
            let result;
                if (isNaN(num1)||isNaN(num2)){
                    result="check your entered input";
                }
               else{
                switch(operation){
                    case"add":
                    result=num1+num2;
                    break;
                    case"Subraction":
                    result=num1-num2;
                    break;
                    case"multiplication":
                    result=num1*num2;
                    break;
                    case"Division":
                    result=num1%num2;
                    break;
                    case"Modulus":
                    result=num1%num2;
                    break;
                }
            }
document.getElementById("result").innerText="result is:"+result;
            }
    </script>
</body>
</html>
